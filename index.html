<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>[달에서.] TRPG 테스트</title>
  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
    }

    body {
      background-color: #121212;
      color: #e0e0e0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .card {
      background-color: #1e1e1e;
      border: 1px solid #333;
      border-radius: 12px;
      padding: 28px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
    }

    h1 {
      font-size: 1.5rem;
      margin-bottom: 20px;
      color: #ffffff;
      font-weight: 700;
    }

    .form-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-size: 0.9rem;
      margin-bottom: 6px;
      color: #aaa;
    }

    input, select {
      width: 100%;
      padding: 10px 12px;
      border-radius: 6px;
      border: 1px solid #444;
      background-color: #2a2a2a;
      color: #fff;
      font-size: 0.95rem;
      outline: none;
    }

    input:focus, select:focus {
      border-color: #4b6cb7;
    }

    button {
      width: 100%;
      padding: 12px;
      border-radius: 6px;
      border: none;
      background-color: #3b5998;
      color: #fff;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s;
      margin-top: 10px;
    }

    button:hover {
      background-color: #4c70ba;
    }

    .btn-group {
      display: flex;
      gap: 10px;
      margin-top: 10px;
    }

    button.save-btn {
      background-color: #2e7d32;
    }

    button.save-btn:hover {
      background-color: #388e3c;
    }

    button.reset-btn {
      background-color: #d32f2f;
      flex: 0.4;
    }

    button.reset-btn:hover {
      background-color: #e53935;
    }

    .stat-list {
      margin: 16px 0 20px 0;
      border-top: 1px solid #333;
      padding-top: 15px;
    }

    .stat-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
      font-size: 0.95rem;
    }

    .btn-controls {
      display: flex;
      gap: 6px;
    }

    .stat-btn {
      width: 32px;
      height: 32px;
      padding: 0;
      margin: 0;
      line-height: 32px;
      font-size: 1.1rem;
      border-radius: 4px;
      background-color: #3a3a3a;
    }

    .stat-btn:hover {
      background-color: #505050;
    }

    /* === 경고 박스 스타일 === */
    .warning-box {
      background-color: rgba(255, 152, 0, 0.1);
      border: 1px solid #ff9800;
      border-radius: 6px;
      padding: 10px 12px;
      margin-top: 12px;
      font-size: 0.85rem;
      color: #ffb74d;
      line-height: 1.4;
      display: flex;
      align-items: flex-start;
      gap: 6px;
    }

    .error-msg {
      color: #ff6b6b;
      font-size: 0.85rem;
      margin-top: 12px;
      word-break: break-all;
    }

    /* === 툴팁 CSS 스타일 === */
    .tooltip {
      position: relative;
      display: inline-block;
      cursor: help;
      border-bottom: 1px dotted #888;
    }

    .tooltip .tooltiptext {
      visibility: hidden;
      width: 220px;
      background-color: #2a2a2a;
      color: #fff;
      text-align: center;
      border: 1px solid #444;
      border-radius: 6px;
      padding: 8px 10px;
      font-size: 0.85rem;
      font-weight: normal;
      position: absolute;
      z-index: 10;
      bottom: 125%; 
      left: 50%;
      transform: translateX(-50%);
      opacity: 0;
      transition: opacity 0.2s ease-in-out;
      box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.5);
      pointer-events: none;
    }

    .tooltip .tooltiptext::after {
      content: "";
      position: absolute;
      top: 100%;
      left: 50%;
      margin-left: -5px;
      border-width: 5px;
      border-style: solid;
      border-color: #2a2a2a transparent transparent transparent;
    }

    .tooltip:hover .tooltiptext {
      visibility: visible;
      opacity: 1;
    }

    /* === 토스트 알림 CSS === */
    #toast {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background-color: #323232;
      color: #fff;
      padding: 12px 24px;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 600;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
      opacity: 0;
      visibility: hidden;
      transition: all 0.3s ease;
      z-index: 1000;
      border: 1px solid #444;
    }

    #toast.show {
      opacity: 1;
      visibility: visible;
      transform: translateX(-50%) translateY(0);
    }

    #toast.success { background-color: #2e7d32; border-color: #388e3c; }
    #toast.warning { background-color: #e65100; border-color: #f57c00; }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>

  <div class="card">
    <!-- 1. 로그인 / 회원가입 세션 -->
    <div id="auth-section">
      <h1>[달에서.] 테스트 접속</h1>
      <div class="form-group">
        <input type="text" id="username" placeholder="아이디 입력" autocomplete="off">
      </div>
      <div class="form-group">
        <input type="password" id="password" placeholder="비밀번호 (6자리 이상)">
      </div>
      <div class="form-group">
        <input type="text" id="char-name" placeholder="캐릭터 이름 입력">
      </div>
      <div class="form-group">
        <label>직급 선택:</label>
        <select id="role-select">
          <option value="student">일반 학생 (초기 10pt / 스탯 상한 5)</option>
          <option value="council">학생회장 (초기 12pt / 스탯 상한 6)</option>
          <option value="teacher">교사 (초기 15pt / 스탯 상한 7)</option>
        </select>
      </div>
      <button onclick="handleAuth()">시작하기 (접속/가입)</button>
      <div id="auth-error" class="error-msg"></div>
    </div>

    <!-- 2. 캐릭터 스탯 관리 세션 -->
    <div id="character-section" class="hidden">
      <h1 id="display-username">캐릭터 이름</h1>
      <p style="margin-bottom: 6px; color: #aaa;">직급: <span id="display-role" style="color: #fff;">-</span></p>
      
      <!-- 포인트 잔여 / 저장 완료 안내 -->
      <p id="points-container" style="margin-bottom: 8px; color: #aaa;">
        남은 포인트: <span id="available-pts" style="color: #ffc107; font-weight: bold;">0</span>
      </p>
      <p id="completed-notice" class="hidden" style="margin-bottom: 12px; color: #4caf50; font-size: 0.9rem;">
        ✔ 스탯 설정이 완료된 캐릭터입니다.
      </p>

      <!-- 스탯 미확정 시 표시되는 경고 문구 -->
      <div id="stat-warning-box" class="warning-box">
        <span>⚠️</span>
        <div>초기 스탯은 저장 이후 <b>수정이 불가능</b>합니다. 신중하게 분배해 주세요!</div>
      </div>
      
      <div class="stat-list">
        <!-- 지혜 -->
        <div class="stat-row">
          <div>
            <span class="tooltip">
              지혜 (Wisdom)
              <span class="tooltiptext">지식, 추리력, 마법 주문 이해도 및 통찰력</span>
            </span>
            : <span id="wisdom-val">1</span>
          </div>
          <div class="btn-controls stat-ctrl">
            <button class="stat-btn" onclick="decreaseStat('wisdom')">-</button>
            <button class="stat-btn" onclick="increaseStat('wisdom')">+</button>
          </div>
        </div>

        <!-- 의지 -->
        <div class="stat-row">
          <div>
            <span class="tooltip">
              의지 (Willpower)
              <span class="tooltiptext">정신력, 멘탈 저항, 집중력 및 위기 극복 능력</span>
            </span>
            : <span id="willpower-val">1</span>
          </div>
          <div class="btn-controls stat-ctrl">
            <button class="stat-btn" onclick="decreaseStat('willpower')">-</button>
            <button class="stat-btn" onclick="increaseStat('willpower')">+</button>
          </div>
        </div>

        <!-- 가호 -->
        <div class="stat-row">
          <div>
            <span class="tooltip">
              가호 (Divine)
              <span class="tooltiptext">운, 신성한 보호, 기적 발동 및 치명적 위기 회피</span>
            </span>
            : <span id="divine-val">1</span>
          </div>
          <div class="btn-controls stat-ctrl">
            <button class="stat-btn" onclick="decreaseStat('divine')">-</button>
            <button class="stat-btn" onclick="increaseStat('divine')">+</button>
          </div>
        </div>

        <!-- 교감 -->
        <div class="stat-row">
          <div>
            <span class="tooltip">
              교감 (Affinity)
              <span class="tooltiptext">타인과의 소통, 사역마/정령 교감, 설득 및 매력</span>
            </span>
            : <span id="affinity-val">1</span>
          </div>
          <div class="btn-controls stat-ctrl">
            <button class="stat-btn" onclick="decreaseStat('affinity')">-</button>
            <button class="stat-btn" onclick="increaseStat('affinity')">+</button>
          </div>
        </div>
      </div>

      <!-- 하단 조작 버튼 그룹 -->
      <div id="action-btn-group" class="btn-group">
        <button class="reset-btn" onclick="resetStats()">초기화</button>
        <button class="save-btn" onclick="saveStats()">스탯 저장하기</button>
      </div>
      <div id="stat-error" class="error-msg"></div>
    </div>
  </div>

  <!-- 토스트 알림 영역 -->
  <div id="toast">알림 메시지</div>

  <script>
  // Supabase 연동 설정
  const SUPABASE_URL = 'https://ussdpozmngczyrabcgun.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_NHt6pA_nGOl4zDKgUTntfA_LGioJewy';
  
  const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  let currentUserId = null;
  let characterData = null;
  let initialCharacterData = null;

  // 직급별 기본 설정
  const ROLE_CONFIG = {
    student: { name: '일반 학생', pts: 10, maxStat: 5 },
    council: { name: '학생회장', pts: 12, maxStat: 6 },
    teacher: { name: '교사', pts: 15, maxStat: 7 }
  };

  // 직급명 또는 Key를 가져와 해당 직급의 maxStat을 찾는 헬퍼 함수
  function getMaxStatForRole(roleStr) {
    if (!roleStr) return 5;
    const cleanRole = roleStr.toString().trim();
    
    for (const key in ROLE_CONFIG) {
      if (key === cleanRole || ROLE_CONFIG[key].name === cleanRole) {
        return ROLE_CONFIG[key].maxStat;
      }
    }
    return 5; // 기본값
  }

  // 토스트 알림 표시 함수
  let toastTimeout = null;
  function showToast(message, type = 'success') {
    const toast = document.getElementById('toast');
    toast.innerText = message;
    toast.className = `show ${type}`;

    if (toastTimeout) clearTimeout(toastTimeout);
    
    toastTimeout = setTimeout(() => {
      toast.className = '';
    }, 3000);
  }

  // 가입 및 접속 처리
  async function handleAuth() {
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value.trim();
    const charName = document.getElementById('char-name').value.trim();
    const roleKey = document.getElementById('role-select').value;
    const errorDiv = document.getElementById('auth-error');

    errorDiv.innerText = '';

    if (!username || !password) {
      errorDiv.innerText = '아이디와 비밀번호를 입력해 주세요.';
      return;
    }

    const fakeEmail = `${username}@lunar-academy.trpg`;

    // 1. 로그인 시도
    let { data, error } = await supabaseClient.auth.signInWithPassword({
      email: fakeEmail,
      password: password
    });

    // 2. 로그인 실패 시 회원가입 시도
    if (error) {
      if (!charName) {
        errorDiv.innerText = '신규 회원가입 시 캐릭터 이름을 입력해야 합니다.';
        return;
      }

      const signUpRes = await supabaseClient.auth.signUp({
        email: fakeEmail,
        password: password
      });

      if (signUpRes.error) {
        errorDiv.innerText = '회원가입 에러: ' + signUpRes.error.message;
        return;
      }

      data = signUpRes.data;

      const roleInfo = ROLE_CONFIG[roleKey];
      const { error: insertError } = await supabaseClient.from('characters').insert([
        {
          user_id: data.user.id,
          name: charName,
          role: roleInfo.name,
          wisdom: 1,
          willpower: 1,
          divine: 1,
          affinity: 1,
          available_points: roleInfo.pts
        }
      ]);

      if (insertError) {
        errorDiv.innerText = '캐릭터 생성 에러: ' + insertError.message;
        return;
      }
    }

    currentUserId = data.user.id;
    loadCharacterData();
  }

  // 캐릭터 데이터 로드 (수정 및 통합 완료)
  async function loadCharacterData() {
    const { data, error } = await supabaseClient
      .from('characters')
      .select('*')
      .eq('user_id', currentUserId)
      .maybeSingle(); // single() 대신 maybeSingle()을 사용하여 데이터가 없어도 에러 없이 null 반환

    if (error) {
      document.getElementById('auth-error').innerText = '데이터 로드 에러: ' + error.message;
      return;
    }

    // 로그인에는 성공했지만 캐릭터 데이터가 DB에서 지워진 경우 (자동 재등록 처리)
    if (!data) {
      const charName = document.getElementById('char-name').value.trim();
      const roleKey = document.getElementById('role-select').value;

      if (!charName) {
        document.getElementById('auth-error').innerText = '캐릭터 데이터가 존재하지 않습니다. [캐릭터 이름]을 입력 후 다시 시작하기를 누르면 새로 생성됩니다.';
        return;
      }

      const roleInfo = ROLE_CONFIG[roleKey];
      const { error: insertError } = await supabaseClient.from('characters').insert([
        {
          user_id: currentUserId,
          name: charName,
          role: roleInfo.name,
          wisdom: 1,
          willpower: 1,
          divine: 1,
          affinity: 1,
          available_points: roleInfo.pts
        }
      ]);

      if (insertError) {
        document.getElementById('auth-error').innerText = '캐릭터 생성 실패: ' + insertError.message;
        return;
      }

      // 새로 생성 후 재로드
      return loadCharacterData();
    }

    // 정상적으로 데이터를 불러온 경우
    characterData = data;
    initialCharacterData = JSON.parse(JSON.stringify(data));

    updateUI();

    document.getElementById('auth-section').classList.add('hidden');
    document.getElementById('character-section').classList.remove('hidden');
  }

  // 화면 UI 업데이트 함수
  function updateUI() {
    document.getElementById('display-username').innerText = characterData.name;
    const roleMap = { student: '일반 학생', council: '학생회장', teacher: '교사' };
    const cleanRole = (characterData.role || '').toString().trim().toLowerCase();
    document.getElementById('display-role').innerText = roleMap[cleanRole] || characterData.role;
    document.getElementById('available-pts').innerText = characterData.available_points;

    document.getElementById('wisdom-val').innerText = characterData.wisdom;
    document.getElementById('willpower-val').innerText = characterData.willpower;
    document.getElementById('divine-val').innerText = characterData.divine;
    document.getElementById('affinity-val').innerText = characterData.affinity;

    // 이미 저장이 끝난 캐릭터(남은 포인트가 0)인지 확인하여 UI 전환
    const isCompleted = characterData.available_points === 0 && initialCharacterData.available_points === 0;

    const ctrlBtns = document.querySelectorAll('.stat-ctrl');
    const actionGroup = document.getElementById('action-btn-group');
    const pointsContainer = document.getElementById('points-container');
    const completedNotice = document.getElementById('completed-notice');
    const warningBox = document.getElementById('stat-warning-box');

    if (isCompleted) {
      // 저장이 이미 완료된 상태: 버튼 및 경고창 감추기
      ctrlBtns.forEach(btn => btn.classList.add('hidden'));
      actionGroup.classList.add('hidden');
      pointsContainer.classList.add('hidden');
      warningBox.classList.add('hidden');
      completedNotice.classList.remove('hidden');
    } else {
      // 스탯 분배 중인 상태: 버튼 및 경고창 보여주기
      ctrlBtns.forEach(btn => btn.classList.remove('hidden'));
      actionGroup.classList.remove('hidden');
      pointsContainer.classList.remove('hidden');
      warningBox.classList.remove('hidden');
      completedNotice.classList.add('hidden');
    }
  }

  // 스탯 증가 처리 (상한선 제한 적용)
  function increaseStat(statName) {
    if (characterData.available_points <= 0) {
      showToast('사용 가능한 포인트가 없습니다.', 'warning');
      return;
    }

    const maxLimit = getMaxStatForRole(characterData.role);
    if (characterData[statName] >= maxLimit) {
      showToast(`${characterData.role}의 최대 스탯 상한선은 ${maxLimit}입니다.`, 'warning');
      return;
    }

    characterData[statName] += 1;
    characterData.available_points -= 1;
    updateUI();
  }

  // 스탯 감소 처리 (-)
  function decreaseStat(statName) {
    const minLimit = initialCharacterData[statName];
    if (characterData[statName] <= minLimit) {
      showToast(`스탯은 최소 ${minLimit} 미만으로 내릴 수 없습니다.`, 'warning');
      return;
    }

    characterData[statName] -= 1;
    characterData.available_points += 1;
    updateUI();
  }

  // 스탯 초기화 버튼
  function resetStats() {
    characterData = JSON.parse(JSON.stringify(initialCharacterData));
    updateUI();
    showToast('스탯 상태가 초기화되었습니다.', 'warning');
  }

  // DB에 스탯 저장하기
  async function saveStats() {
    const errorDiv = document.getElementById('stat-error');
    errorDiv.innerText = '';

    if (characterData.available_points > 0) {
      if (!confirm(`남은 포인트가 ${characterData.available_points}pt 있습니다. 저장 후에는 수정할 수 없습니다. 정말 확정하시겠습니까?`)) {
        return;
      }
    } else {
      if (!confirm('스탯을 저장한 후에는 다시 변경할 수 없습니다. 이대로 확정하시겠습니까?')) {
        return;
      }
    }

    const { error } = await supabaseClient
      .from('characters')
      .update({
        wisdom: characterData.wisdom,
        willpower: characterData.willpower,
        divine: characterData.divine,
        affinity: characterData.affinity,
        available_points: characterData.available_points
      })
      .eq('user_id', currentUserId);

    if (error) {
      errorDiv.innerText = '스탯 저장 실패: ' + error.message;
    } else {
      initialCharacterData = JSON.parse(JSON.stringify(characterData));
      updateUI();
      showToast('스탯이 최종 저장되었습니다!', 'success');
    }
  }

  document.querySelectorAll('.tooltip').forEach(elem => {
    elem.addEventListener('touchstart', function() {}, { passive: true });
  });
</script>
</body>
</html>
