      { id: "PAS_19", category: "실용생활학", name: "조리학", stat: "방직", passive: "식사 재정비", effect: "Next_Check_Bonus +1", constraint: "휴식 후 1회" },
      { id: "PAS_20", category: "실용생활학", name: "디자인학", stat: "방직", passive: "신분 위장", effect: "Disguise_Dice +1D", constraint: "상시 적용" },
      { id: "PAS_21", category: "실용생활학", name: "재료 가공학", stat: "방직", passive: "효율 가공", effect: "Material_Destroy_Prevent", constraint: "상시 적용" },
      { id: "PAS_22", category: "실용생활학", name: "카룬 해부학", stat: "재정", passive: "약점 타격", effect: "Extra_Damage_Dice +1D", constraint: "성공 시" },
      { id: "PAS_23", category: "실용생활학", name: "응용정리학", stat: "방직", passive: "도구 수색", effect: "Consumable_Cost_Reduce", constraint: "성공 시" }
    ];

    /* 공통교양 데이터 */
    const GENERAL_EDU_DATA = [
      { id: "PAS_24", category: "공통교양", name: "해독학", stat: "재정", passive: "독성 완화", effect: "Poison_Duration -1Turn", constraint: "상시 적용" },
      { id: "PAS_25", category: "공통교양", name: "응급처치학", stat: "재정", passive: "응급 처치", effect: "HP_Recovery_Check", constraint: "스탯 판정 시" },
      { id: "PAS_26", category: "공통교양", name: "상황대처학", stat: "단선", passive: "도주 지원", effect: "Escape_Dice +1D (파티 전체)", constraint: "스탯 판정 시" },
      { id: "PAS_27", category: "공통교양", name: "금전학", stat: "재정", passive: "흥정", effect: "Trade_Discount_Check +1D", constraint: "상시 적용" }
    ];

    let currentStep = 1;
    let stats = { klotho: 1, lachesis: 1, atropos: 1 };
    let maxPoints = 7;
    let isNicknameChecked = false;

    window.onload = () => {
      initDropdowns();
      updateMaxPoints();
    };

    function initDropdowns() {
      const mainSelect = document.getElementById('major');
      mainSelect.innerHTML = MAIN_MAJORS.map(m => `<option value="${m.name}">${m.name} (${m.category})</option>`).join('');

      const genSelect = document.getElementById('general-edu');
      genSelect.innerHTML = GENERAL_EDU_DATA.map(g => `<option value="${g.name}">${g.name}</option>`).join('');

      updateSubMajorDropdowns();
    }

    function updateSubMajorDropdowns() {
      const sub1Select = document.getElementById('sub-major-1');
      sub1Select.innerHTML = SUB_MAJORS.map(m => `<option value="${m.name}">${m.name} (${m.category})</option>`).join('');
      onSubMajorChange();
    }

    function onSubMajorChange() {
      const sub1Val = document.getElementById('sub-major-1').value;
      const sub2Select = document.getElementById('sub-major-2');
      const filtered = SUB_MAJORS.filter(m => m.name !== sub1Val);
      sub2Select.innerHTML = filtered.map(m => `<option value="${m.name}">${m.name} (${m.category})</option>`).join('');
      updateGuide();
    }

    function onGradeChange() {
      updateMaxPoints();
      updateGuide();
    }

    function updateMaxPoints() {
      const gradeStr = document.getElementById('grade').value;
      const gradeNum = parseInt(gradeStr.replace('학년', ''), 10);

      maxPoints = (gradeNum >= 9) ? 8 : 7;
      document.getElementById('max-pt').innerText = maxPoints;

      stats = { klotho: 1, lachesis: 1, atropos: 1 };
      document.getElementById('val-klotho').innerText = 1;
      document.getElementById('val-lachesis').innerText = 1;
      document.getElementById('val-atropos').innerText = 1;

      const currentUsed = (stats.klotho - 1) + (stats.lachesis - 1) + (stats.atropos - 1);
      const remain = maxPoints - currentUsed;

      document.getElementById('remain-pt').innerText = remain;
      document.getElementById('btn-complete').disabled = (remain !== 0);
    }

    function openSignupModal() {
      document.getElementById('step-0-card').classList.add('hidden');
      document.getElementById('signup-card').classList.remove('hidden');
      document.getElementById('guide-card').classList.remove('hidden');
      goStep(1);
    }

    function closeSignupModal() {
      document.getElementById('signup-card').classList.add('hidden');
      document.getElementById('guide-card').classList.add('hidden');
      document.getElementById('step-0-card').classList.remove('hidden');
    }

    function goStep(step) {
      if (step === 2) {
        const nickname = document.getElementById('nickname').value.trim();
        const charName = document.getElementById('char-name').value.trim();
        if (!nickname || !charName) {
          alert("닉네임과 캐릭터 이름을 입력해주세요.");
          return;
        }
        if (containsBannedWord(nickname) || containsBannedWord(charName)) {
          alert("사용 불가능한 단어가 포함되어 있습니다.");
          return;
        }
        if (!isNicknameChecked) {
          alert("닉네임 중복확인을 먼저 진행해 주세요.");
          return;
        }
      }

      currentStep = step;
      ['step-1', 'step-2', 'step-3'].forEach((id, idx) => {
        document.getElementById(id).classList.toggle('hidden', idx + 1 !== step);
      });

      document.getElementById('modal-title').innerText = `Step ${step}. ` + 
        (step === 1 ? '기본 정보' : step === 2 ? '태생 및 학과 선택' : '운명 스탯 배분');

      updateGuide();
    }

    function updateGuide() {
      const guideTitle = document.getElementById('guide-step-title');
      const guideBody = document.getElementById('guide-body');

      if (currentStep === 1) {
        guideTitle.innerText = "Step 1. 학년 및 캐릭터 가이드";
        const selectedGrade = document.getElementById('grade').value;
        const gradeNum = parseInt(selectedGrade.replace('학년', ''), 10);

        let bonusText = "";
        if (gradeNum <= 4) {
          bonusText = "기본 스탯 포인트 <strong>7pt</strong> 제공";
        } else if (gradeNum <= 8) {
          bonusText = "스탯 포인트 <strong>7pt</strong> + TRPG 어시스트 시 <strong>다이스 판정 +1 (+1D)</strong>";
        } else {
          bonusText = "스탯 포인트 <strong>8pt</strong> + TRPG 어시스트 시 <strong>다이스 판정 +1 (+1D)</strong>";
        }

        guideBody.innerHTML = `
          <div class="guide-section">
            <span class="guide-badge">현재 선택: ${selectedGrade}</span>
            <div class="guide-section-title">🎓 학년별 스탯 및 패시브 혜택</div>
            <p>· <strong>1~4학년</strong>: 스탯 포인트 7pt</p>
            <p>· <strong>5~8학년</strong>: 스탯 포인트 7pt + 어시스트 시 다이스 판정 +1</p>
            <p>· <strong>9~12학년</strong>: 스탯 포인트 8pt + 어시스트 시 다이스 판정 +1</p>
            <div style="margin-top:10px; padding:8px; background:#1e1e24; border-radius:4px; font-size:0.8rem; color:#88aaff;">
              ✨ <strong>적용 혜택:</strong> ${bonusText}
            </div>
          </div>
          <div class="guide-section">
            <div class="guide-section-title">💡 계정 및 캐릭터 설정</div>
            <p>· <strong>본닉</strong>: 커뮤니티 플레이어 식별용 이름</p>
            <p>· <strong>캐릭터 이름</strong>: RP(Role Play) 진행 시 공식 성명입니다.</p>
          </div>
        `;
      } 
      else if (currentStep === 2) {
        guideTitle.innerText = "Step 2. 태생 및 전공/교양 정보";
        
        const originKey = document.getElementById('origin').value;
        const originInfo = ORIGINS_DATA[originKey];

        const mName = document.getElementById('major').value;
        const s1Name = document.getElementById('sub-major-1').value;
        const s2Name = document.getElementById('sub-major-2').value;
        const gName = document.getElementById('general-edu').value;

        const mObj = MAIN_MAJORS.find(x => x.name === mName) || {};
        const s1Obj = SUB_MAJORS.find(x => x.name === s1Name) || {};
        const s2Obj = SUB_MAJORS.find(x => x.name === s2Name) || {};
        const gObj = GENERAL_EDU_DATA.find(x => x.name === gName) || {};

        guideBody.innerHTML = `
          <div class="guide-section" style="border-left-color: #ffaa00;">
            <span class="guide-badge" style="background:#4a3800; color:#ffdd88;">태생 선택</span> <strong>${originInfo.name}</strong>
            <p style="margin-top:4px;"><strong>특화 형태:</strong> ${originInfo.type}</p>
            <p><strong>3-Track Filter 범위:</strong> ${originInfo.filter}</p>
            <p><strong>장점:</strong> ${originInfo.pros}</p>
            <div class="guide-constraint">⚠️ 단점: ${originInfo.cons}</div>
          </div>

          <div class="guide-section">
            <span class="guide-badge">주전공</span> <strong>${mObj.name || ''}</strong> (${mObj.category || ''})
            <p><strong>패시브:</strong> ${mObj.passive || ''} [스탯: ${mObj.stat || ''}]</p>
            <p>· <strong>효과:</strong> ${mObj.effect || ''}</p>
            <div class="guide-constraint">⚠️ 제약: ${mObj.constraint || ''}</div>
          </div>

          <div class="guide-section">
            <span class="guide-badge">부전공 1</span> <strong>${s1Obj.name || ''}</strong> (${s1Obj.category || ''})
            <p><strong>패시브:</strong> ${s1Obj.passive || ''} [스탯: ${s1Obj.stat || ''}]</p>
            <p>· <strong>효과:</strong> ${s1Obj.effect || ''}</p>
            <div class="guide-constraint">⚠️ 제약: ${s1Obj.constraint || ''}</div>
          </div>

          <div class="guide-section">
            <span class="guide-badge">부전공 2</span> <strong>${s2Obj.name || ''}</strong> (${s2Obj.category || ''})
            <p><strong>패시브:</strong> ${s2Obj.passive || ''} [스탯: ${s2Obj.stat || ''}]</p>
            <p>· <strong>효과:</strong> ${s2Obj.effect || ''}</p>
            <div class="guide-constraint">⚠️ 제약: ${s2Obj.constraint || ''}</div>
          </div>

          <div class="guide-section">
            <span class="guide-badge">공통교양</span> <strong>${gObj.name || ''}</strong>
            <p><strong>패시브:</strong> ${gObj.passive || ''} [스탯: ${gObj.stat || ''}]</p>
            <p>· <strong>효과:</strong> ${gObj.effect || ''}</p>
            <div class="guide-constraint">⚠️ 제약: ${gObj.constraint || ''}</div>
          </div>
        `;
      } 
      else if (currentStep === 3) {
        guideTitle.innerText = "Step 3. 스탯 및 단선 토큰 시스템";
        guideBody.innerHTML = `
          <div class="guide-section">
            <div class="guide-section-title">🧵 방직 (紡織 / Clotho)</div>
            <p>물리/실체 권능. 물리 공격·방어, 신체 행동력, 장비 가공/수리, 물리적 위기 회피 판정에 적용됩니다.</p>
          </div>
          <div class="guide-section">
            <div class="guide-section-title">⚖️ 재정 (裁定 / Lachesis)</div>
            <p>지식/섭리 권능. 마법 행사, 지형/속성/카룬 분석, 결계, 정보 탐색 및 약점 파악 판정에 적용됩니다.</p>
          </div>
          <div class="guide-section">
            <div class="guide-section-title">✂️ 단선 (斷線 / Atropos)</div>
            <p>차단/인과 권능. 불리함 사전 차단 및 상태 이상 해제, 도주, 정화, 사망 유예 판정에 적용됩니다.</p>
          </div>
          <div class="guide-section">
            <div class="guide-section-title">🎟️ 단선 토큰 혜택 (단선 수치만큼 소지)</div>
            <p>· <strong>1토큰 (해제)</strong>: 본인/아군 상태 이상/디버프 1개 확정 제거 (노 굴림)</p>
            <p>· <strong>1토큰 (상쇄)</strong>: 판정 직전 불리함(-1D) 사전 확정 제거 (노 굴림)</p>
            <p>· <strong>2토큰 (확정)</strong>: 주사위 연산 없이 즉시 대성공(Critical) 처리</p>
            <p>· <strong>2토큰 (정화)</strong>: 파티 전체 디버프 및 불리함(-1D) 일괄 제거</p>
            <p>· <strong>2토큰 (유예)</strong>: 탈락/사망 상태를 강제 차단하고 1턴간 생존 유지</p>
          </div>
        `;
      }
    }

    function containsBannedWord(text) {
      return BANNED_WORDS.some(w => text.toLowerCase().includes(w.toLowerCase()));
    }

    async function checkNicknameDuplicate() {
      const nickname = document.getElementById('nickname').value.trim();
      if (!nickname) return alert("닉네임을 입력해주세요.");
      if (containsBannedWord(nickname)) return alert("금지어가 포함되어 있습니다.");

      const { data } = await supabaseClient.from('characters').select('id').eq('nickname', nickname);
      if (data && data.length > 0) {
        alert("이미 존재하거나 사용 중인 닉네임입니다.");
        isNicknameChecked = false;
      } else {
        alert("사용 가능한 닉네임입니다!");
        isNicknameChecked = true;
      }
    }

    function changeStat(key, delta) {
      const currentUsed = (stats.klotho - 1) + (stats.lachesis - 1) + (stats.atropos - 1);
      const remain = maxPoints - currentUsed;

      if (delta > 0 && remain <= 0) return;
      if (delta < 0 && stats[key] <= 1) return;

      stats[key] += delta;
      document.getElementById(`val-${key}`).innerText = stats[key];

      const newUsed = (stats.klotho - 1) + (stats.lachesis - 1) + (stats.atropos - 1);
      const newRemain = maxPoints - newUsed;
      document.getElementById('remain-pt').innerText = newRemain;
      document.getElementById('btn-complete').disabled = (newRemain !== 0);
    }

    async function handleLogin() {
      const username = document.getElementById('login-username').value.trim();
      const password = document.getElementById('login-password').value.trim();
      if (!username || !password) return alert("아이디와 비밀번호를 입력해 주세요.");

      const { data: authData, error } = await supabaseClient.auth.signInWithPassword({
        email: `${username}@moon.local`,
        password: password
      });

      if (error) return alert("로그인 실패: 아이디 또는 비밀번호가 일치하지 않습니다.");

      const { data: character } = await supabaseClient
        .from('characters')
        .select('*')
        .eq('user_id', authData.user.id)
        .maybeSingle();

      if (character) {
        renderMainApp(character.username || username, character.nickname);
      } else {
        alert("프로필 정보가 없습니다. 가입을 완료해 주세요.");
        openSignupModal();
      }
    }

    async function handleRegisterComplete() {
      const username = document.getElementById('reg-username').value.trim();
      const password = document.getElementById('reg-password').value.trim();
      const nickname = document.getElementById('nickname').value.trim();
      const charName = document.getElementById('char-name').value.trim();
      const grade = document.getElementById('grade').value;
      const originKey = document.getElementById('origin').value;
      const originName = ORIGINS_DATA[originKey]?.name || originKey;

      if (!username || !password || password.length < 6) {
        return alert("아이디와 6자리 이상의 비밀번호를 입력해 주세요.");
      }

      const { data: signUpData, error: signUpError } = await supabaseClient.auth.signUp({
        email: `${username}@moon.local`,
        password: password
      });

      if (signUpError) return alert("계정 생성 실패: " + signUpError.message);

      const { error: dbError } = await supabaseClient.from('characters').insert([{
        user_id: signUpData.user.id,
        username: username,
        nickname: nickname,
        name: charName,
        role: `${grade} (${originName})`,
        klotho: stats.klotho,
        lachesis: stats.lachesis,
        atropos: stats.atropos,
        available_points: 0
      }]);

      if (dbError) return alert("DB 저장 오류: " + dbError.message);

      alert("성공적으로 회원가입이 완료되었습니다!");
      closeSignupModal();
      renderMainApp(username, nickname);
    }

    function renderMainApp(username, nickname) {
      document.getElementById('step-0-card').classList.add('hidden');
      document.getElementById('signup-card').classList.add('hidden');
      document.getElementById('guide-card').classList.add('hidden');
      document.getElementById('main-app').classList.remove('hidden');
      document.getElementById('user-info-text').innerText = `${nickname} (${username}) 님으로 접속되었습니다.`;
    }

    async function handleLogout() {
      await supabaseClient.auth.signOut();
      document.getElementById('main-app').classList.add('hidden');
      document.getElementById('step-0-card').classList.remove('hidden');
    }
  </script>
</body>
</html>
