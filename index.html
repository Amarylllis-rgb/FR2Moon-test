<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>[달에서.] 접속하기</title>

  <style>
    body {
      background-color: #121212;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
    }

    /* 2컬럼 레이아웃 컨테이너 */

      display: flex;
      gap: 20px;
      max-width: 920px;
      width: 100%;
      align-items: stretch;
    }

    .card {
      background-color: #1e1e1e;
      border-radius: 12px;
      padding: 28px;
      flex: 1;
      box-shadow: 0 8px 24px rgba(0,0,0,0.6);
      border: 1px solid #2a2a2a;
    }

    /* 우측 설명서 패널 */
    .guide-card {
      background-color: #18181c;
      border-radius: 12px;
      padding: 24px;
      width: 380px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.6);
      border: 1px solid #2e2e38;
      display: flex;
      flex-direction: column;
    }

    .title {
      font-size: 1.25rem;
      font-weight: 700;
      margin-bottom: 20px;
      color: #fff;
    }

    .guide-title {
      font-size: 1.05rem;
      font-weight: 700;
      color: #88aaff;
      margin-bottom: 14px;
      border-bottom: 1px solid #333;
      padding-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .guide-content {
      font-size: 0.85rem;
      line-height: 1.6;
      color: #ccc;
      overflow-y: auto;
      max-height: 520px;
    }

    .guide-section {
      margin-bottom: 16px;
      background: #22222a;
      padding: 12px;
      border-radius: 6px;
      border-left: 3px solid #4f70e8;
    }

    .guide-section-title {
      font-weight: bold;
      color: #fff;
      margin-bottom: 4px;
      font-size: 0.9rem;
    }

    .guide-badge {
      display: inline-block;
      background-color: #2a354f;
      color: #a3c2ff;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 0.75rem;
      margin-bottom: 6px;
    }

    .guide-constraint {
      font-size: 0.75rem;
      color: #ff9d9d;
      margin-top: 4px;
      font-weight: bold;
    }

    .form-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-size: 0.85rem;
      color: #aaa;
      margin-bottom: 6px;
    }

    input, select {
      width: 100%;
      padding: 10px 12px;
      border-radius: 6px;
      border: 1px solid #333;
      background-color: #2a2a2a;
      color: #fff;
      box-sizing: border-box;
      font-size: 0.9rem;
    }

    input:focus, select:focus {
      outline: none;
      border-color: #4f70e8;
    }

    .input-with-btn {
      display: flex;
      gap: 8px;
    }

    .btn-side {
      width: auto;
      white-space: nowrap;
      background-color: #333;
      border: 1px solid #444;
      color: #fff;
      padding: 0 12px;
      border-radius: 6px;
      cursor: pointer;
    }

    .btn-primary {
      width: 100%;
      padding: 12px;
      background-color: #3b5998;
      border: none;
      border-radius: 6px;
      color: #fff;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
    }

    .btn-primary:disabled {
      background-color: #2a2a2a;
      color: #555;
      cursor: not-allowed;
    }

    .btn-secondary {
      width: 100%;
      padding: 10px;
      background-color: transparent;
      border: 1px solid #444;
      border-radius: 6px;
      color: #aaa;
      margin-top: 8px;
      cursor: pointer;
    }

    .link-btn {
      color: #88aaff;
      font-size: 0.85rem;
      text-align: center;
      margin-top: 16px;
      cursor: pointer;
      text-decoration: underline;
    }

    .stat-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
      padding: 8px 12px;
      background: #25252b;
      border-radius: 6px;
    }

    .stat-ctrl {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .btn-circle {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: 1px solid #555;
      background-color: #333;
      color: #fff;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .badge {
      font-size: 0.8rem;
      color: #88aaff;
      margin-bottom: 12px;
      display: block;
    }

    .hidden { display: none !important; }

</head>

      <div class="form-group">

          <label>계정 닉네임 (본닉):</label>

          </div>

        <div class="form-group">
          <label>RP용 캐릭터 이름 (성/이름):</label>

      </div>

      <!-- STEP 2: 태생 및 학과 선택 -->
      <div id="step-2" class="hidden">
        <div class="form-group">
          <label>태생 선택:</label>
          <select id="origin" onchange="updateGuide()">

            <option value="혼혈">혼혈 마법사</option>
            <option value="마글출신">마글 출신</option>
          </select>
        </div>
        <div class="form-group">
          <label>주전공 (1개):</label>
          <select id="major" onchange="onMajorChange()"></select>
        </div>
        <div class="form-group">
          <label>부전공 1 / 부전공 2:</label>
          <select id="sub-major-1" onchange="onSubMajorChange()" style="margin-bottom:6px;"></select>
          <select id="sub-major-2" onchange="updateGuide()"></select>
        </div>
        <div class="form-group">
          <label>공통교양 (1개):</label>
          <select id="general-edu" onchange="updateGuide()"></select>
        </div>
        <button class="btn-primary" onclick="goStep(3)">다음 (스탯 배분)</button>
        <button class="btn-secondary" onclick="goStep(1)">이전</button>
      </div>

        </div>

        <div class="stat-row">
          <div><strong>방직 (紡織 / Clotho)</strong></div>
          <div class="stat-ctrl">
            <button class="btn-circle" onclick="changeStat('klotho', -1)">-</button>
            <span id="val-klotho">1</span>
            <button class="btn-circle" onclick="changeStat('klotho', 1)">+</button>
          </div>
        </div>

        <div class="stat-row">
          <div><strong>재정 (裁定 / Lachesis)</strong></div>
          <div class="stat-ctrl">
            <button class="btn-circle" onclick="changeStat('lachesis', -1)">-</button>
            <span id="val-lachesis">1</span>
            <button class="btn-circle" onclick="changeStat('lachesis', 1)">+</button>
          </div>
        </div>

        <div class="stat-row">
          <div><strong>단선 (斷線 / Atropos)</strong></div>
          <div class="stat-ctrl">
            <button class="btn-circle" onclick="changeStat('atropos', -1)">-</button>
            <span id="val-atropos">1</span>
            <button class="btn-circle" onclick="changeStat('atropos', 1)">+</button>
          </div>
        </div>

        <button id="btn-complete" class="btn-primary" disabled onclick="handleRegisterComplete()">완료 및 메인 접속</button>
        <button class="btn-secondary" onclick="goStep(2)">이전</button>
      </div>
    </div>

    <!-- Right Side Panel: 오른쪽 설명서 (가이드) -->
    <div id="guide-card" class="guide-card hidden">
      <div class="guide-title">
        <span>📖</span> <span id="guide-step-title">가이드 및 설명</span>
      </div>
      <div class="guide-content" id="guide-body">
        <!-- 동적 렌더링 영역 -->
      </div>
    </div>

    <!-- 메인 대시보드 -->
    <div id="main-app" class="card hidden">
      <div class="title">환영합니다!</div>
      <p id="user-info-text">성공적으로 접속되었습니다.</p>
      <button class="btn-secondary" onclick="handleLogout()">로그아웃</button>
    </div>
  </div>

  <script>

    const GENERAL_EDU_DATA = [
      { name: "해독학", stat: "재정", passive: "독성 완화", effect: "독 상태 이상 지속 시간 1턴 감소", constraint: "상시 적용" },
      { name: "응급처치학", stat: "재정", passive: "응급 처치", effect: "스탯 판정 성공 시 체력(HP) 회복 판정 기회 획득", constraint: "스탯 판정 시" },

    ];

    // 평탄화된 모든 학과 리스트
    const ALL_MAJORS_LIST = Object.values(MAJORS_DATA).flat();

    let currentStep = 1;
    let stats = { klotho: 1, lachesis: 1, atropos: 1 };
    let maxPoints = 7;
    let isNicknameChecked = false;

    window.onload = () => {
      initDropdowns();
    };

    function initDropdowns() {
      // 주전공 드롭다운 (그룹화)
      const majorSelect = document.getElementById('major');
      let majorHTML = "";
      for (const [cat, list] of Object.entries(MAJORS_DATA)) {
        majorHTML += `<optgroup label="[${cat}]">`;
        list.forEach(m => {
          majorHTML += `<option value="${m.name}">${m.name}</option>`;
        });
        majorHTML += `</optgroup>`;
      }
      majorSelect.innerHTML = majorHTML;

      // 공통교양 드롭다운
      const genSelect = document.getElementById('general-edu');
      genSelect.innerHTML = GENERAL_EDU_DATA.map(g => `<option value="${g.name}">${g.name}</option>`).join('');

      onMajorChange();
    }

    function onMajorChange() {
      updateSubMajorDropdowns();
      updateGuide();
    }

    function onSubMajorChange() {
      const currentMajor = document.getElementById('major').value;
      const sub1Val = document.getElementById('sub-major-1').value;

      const sub2Select = document.getElementById('sub-major-2');
      const filtered2 = ALL_MAJORS_LIST.filter(m => m.name !== currentMajor && m.name !== sub1Val);
      sub2Select.innerHTML = filtered2.map(m => `<option value="${m.name}">${m.name}</option>`).join('');

      updateGuide();
    }

    function updateSubMajorDropdowns() {
      const currentMajor = document.getElementById('major').value;

      const sub1Select = document.getElementById('sub-major-1');
      const filtered1 = ALL_MAJORS_LIST.filter(m => m.name !== currentMajor);
      sub1Select.innerHTML = filtered1.map(m => `<option value="${m.name}">${m.name}</option>`).join('');

      onSubMajorChange();
    }

    function openSignupModal() {
      document.getElementById('step-0-card').classList.add('hidden');
      document.getElementById('signup-card').classList.remove('hidden');
      document.getElementById('guide-card').classList.remove('hidden');
      goStep(1);
    }

    function closeSignupModal() {
      document.getElementById('signup-card').classList.add('hidden');
      document.getElementById('guide-card').classList.add('hidden');
      document.getElementById('step-0-card').classList.remove('hidden');
    }

    function goStep(step) {
      if (step === 2) {
        const nickname = document.getElementById('nickname').value.trim();
        const charName = document.getElementById('char-name').value.trim();
        if (!nickname || !charName) {
          alert("닉네임과 캐릭터 이름을 입력해주세요.");
          return;
        }
        if (containsBannedWord(nickname) || containsBannedWord(charName)) {
          alert("사용 불가능한 단어가 포함되어 있습니다.");
          return;
        }
        if (!isNicknameChecked) {
          alert("닉네임 중복확인을 먼저 진행해 주세요.");
          return;
        }
      }

      currentStep = step;
      ['step-1', 'step-2', 'step-3'].forEach((id, idx) => {
        document.getElementById(id).classList.toggle('hidden', idx + 1 !== step);
      });

      document.getElementById('modal-title').innerText = `Step ${step}. ` + 
        (step === 1 ? '기본 정보' : step === 2 ? '태생 및 학과 선택' : '운명 스탯 배분');

      updateGuide();
    }

    // 우측 설명 패널 동적 생성 함수
    function updateGuide() {
      const guideTitle = document.getElementById('guide-step-title');
      const guideBody = document.getElementById('guide-body');

      if (currentStep === 1) {
        guideTitle.innerText = "Step 1. 학년 및 캐릭터 가이드";
        const selectedGrade = document.getElementById('grade').value;
        guideBody.innerHTML = `
          <div class="guide-section">
            <span class="guide-badge">현재 선택: ${selectedGrade}</span>
            <div class="guide-section-title">🎓 학년별 스탯 혜택</div>
            <p>· <strong>1년차 (신입생)</strong>: 기본 <strong>7pt</strong> 지급</p>
            <p>· <strong>2~5년차</strong>: 학년 상승당 +1pt 추가 지급 (최대 11pt)</p>
          </div>
          <div class="guide-section">
            <div class="guide-section-title">💡 계정 및 캐릭터 설정</div>
            <p>· <strong>본닉</strong>: 커뮤니티 플레이어 식별용 이름</p>
            <p>· <strong>캐릭터 이름</strong>: RP(Role Play) 진행 시 마법학교 내에서 사용되는 공식 성명입니다.</p>
          </div>
        `;
      } 
      else if (currentStep === 2) {
        guideTitle.innerText = "Step 2. 선택 학과/교양 패시브 혜택";
        
        const mName = document.getElementById('major').value;
        const s1Name = document.getElementById('sub-major-1').value;
        const s2Name = document.getElementById('sub-major-2').value;
        const gName = document.getElementById('general-edu').value;

        const mObj = ALL_MAJORS_LIST.find(x => x.name === mName) || {};
        const s1Obj = ALL_MAJORS_LIST.find(x => x.name === s1Name) || {};
        const s2Obj = ALL_MAJORS_LIST.find(x => x.name === s2Name) || {};
        const gObj = GENERAL_EDU_DATA.find(x => x.name === gName) || {};

        guideBody.innerHTML = `
          <div class="guide-section">
            <span class="guide-badge">주전공</span> <strong>${mObj.name || ''}</strong>
            <p><strong>패시브:</strong> ${mObj.passive || ''} (${mObj.stat || ''})</p>
            <p>· <strong>유저 혜택:</strong> ${mObj.effect || ''}</p>
            <div class="guide-constraint">⚠️ 제약 조건: ${mObj.constraint || ''}</div>
          </div>

          <div class="guide-section">
            <span class="guide-badge">부전공 1</span> <strong>${s1Obj.name || ''}</strong>
            <p><strong>패시브:</strong> ${s1Obj.passive || ''} (${s1Obj.stat || ''})</p>
            <p>· <strong>유저 혜택:</strong> ${s1Obj.effect || ''}</p>
            <div class="guide-constraint">⚠️ 제약 조건: ${s1Obj.constraint || ''}</div>
          </div>

          <div class="guide-section">
            <span class="guide-badge">부전공 2</span> <strong>${s2Obj.name || ''}</strong>
            <p><strong>패시브:</strong> ${s2Obj.passive || ''} (${s2Obj.stat || ''})</p>
            <p>· <strong>유저 혜택:</strong> ${s2Obj.effect || ''}</p>
            <div class="guide-constraint">⚠️ 제약 조건: ${s2Obj.constraint || ''}</div>
          </div>

          <div class="guide-section">
            <span class="guide-badge">공통교양</span> <strong>${gObj.name || ''}</strong>
            <p><strong>패시브:</strong> ${gObj.passive || ''} (${gObj.stat || ''})</p>
            <p>· <strong>유저 혜택:</strong> ${gObj.effect || ''}</p>
            <div class="guide-constraint">⚠️ 제약 조건: ${gObj.constraint || ''}</div>
          </div>
        `;
      } 
      else if (currentStep === 3) {
        guideTitle.innerText = "Step 3. 스탯 및 단선 토큰 시스템";
        guideBody.innerHTML = `
          <div class="guide-section">
            <div class="guide-section-title">🧵 방직 (紡織 / Clotho)</div>
            <p>물리/실체 권능. 물리 공격·방어, 신체 행동력, 장비 가공/수리, 물리적 위기 회피 판정에 적용됩니다.</p>
          </div>
          <div class="guide-section">
            <div class="guide-section-title">⚖️ 재정 (裁定 / Lachesis)</div>
            <p>지식/섭리 권능. 마법 행사, 지형/속성/카룬 분석, 결계, 정보 탐색 및 약점 파악 판정에 적용됩니다.</p>
          </div>
          <div class="guide-section">
            <div class="guide-section-title">✂️ 단선 (斷線 / Atropos)</div>
            <p>차단/인과 권능. 불리함 사전 차단 및 상태 이상 해제, 도주, 정화, 사망 유예 판정에 적용됩니다.</p>
          </div>
          <div class="guide-section">
            <div class="guide-section-title">🎟️ 단선 토큰 혜택 (단선 수치만큼 소지)</div>
            <p>· <strong>1토큰 (해제)</strong>: 본인/아군 상태 이상/디버프 1개 확정 제거 (노 굴림)</p>
            <p>· <strong>1토큰 (상쇄)</strong>: 판정 직전 불리함(-1D) 사전 확정 제거 (노 굴림)</p>
            <p>· <strong>2토큰 (확정)</strong>: 주사위 연산 없이 즉시 대성공(Critical) 처리</p>
            <p>· <strong>2토큰 (정화)</strong>: 파티 전체 디버프 및 불리함(-1D) 일괄 제거</p>
            <p>· <strong>2토큰 (유예)</strong>: 탈락/사망 상태를 강제 차단하고 1턴간 생존 유지</p>
          </div>
        `;
      }
    }

    function containsBannedWord(text) {
      return BANNED_WORDS.some(w => text.toLowerCase().includes(w.toLowerCase()));
    }

    async function checkNicknameDuplicate() {
      const nickname = document.getElementById('nickname').value.trim();
      if (!nickname) return alert("닉네임을 입력해주세요.");
      if (containsBannedWord(nickname)) return alert("금지어가 포함되어 있습니다.");

      const { data } = await supabaseClient.from('characters').select('id').eq('nickname', nickname);
      if (data && data.length > 0) {
        alert("이미 존재하거나 사용 중인 닉네임입니다.");
        isNicknameChecked = false;
      } else {
        alert("사용 가능한 닉네임입니다!");
        isNicknameChecked = true;
      }
    }

    function changeStat(key, delta) {
      const currentUsed = (stats.klotho - 1) + (stats.lachesis - 1) + (stats.atropos - 1);
      const remain = maxPoints - currentUsed;

      if (delta > 0 && remain <= 0) return;
      if (delta < 0 && stats[key] <= 1) return;

      stats[key] += delta;
      document.getElementById(`val-${key}`).innerText = stats[key];

      const newUsed = (stats.klotho - 1) + (stats.lachesis - 1) + (stats.atropos - 1);
      const newRemain = maxPoints - newUsed;
      document.getElementById('remain-pt').innerText = newRemain;
      document.getElementById('btn-complete').disabled = (newRemain !== 0);
    }

    async function handleLogin() {
      const username = document.getElementById('login-username').value.trim();
      const password = document.getElementById('login-password').value.trim();
      if (!username || !password) return alert("아이디와 비밀번호를 입력해 주세요.");

      const { data: authData, error } = await supabaseClient.auth.signInWithPassword({
        email: `${username}@moon.local`,
        password: password
      });

      if (error) return alert("로그인 실패: 아이디 또는 비밀번호가 일치하지 않습니다.");

      const { data: character } = await supabaseClient
        .from('characters')
        .select('*')
        .eq('user_id', authData.user.id)
        .maybeSingle();

      if (character) {
        renderMainApp(character.username || username, character.nickname);
      } else {
        alert("프로필 정보가 없습니다. 가입을 완료해 주세요.");
        openSignupModal();
      }
    }

    async function handleRegisterComplete() {
      const username = document.getElementById('reg-username').value.trim();
      const password = document.getElementById('reg-password').value.trim();
      const nickname = document.getElementById('nickname').value.trim();
      const charName = document.getElementById('char-name').value.trim();
      const grade = document.getElementById('grade').value;
      const origin = document.getElementById('origin').value;

      if (!username || !password || password.length < 6) {
        return alert("아이디와 6자리 이상의 비밀번호를 입력해 주세요.");
      }

      const { data: signUpData, error: signUpError } = await supabaseClient.auth.signUp({
        email: `${username}@moon.local`,
        password: password
      });

      if (signUpError) return alert("계정 생성 실패: " + signUpError.message);

      const { error: dbError } = await supabaseClient.from('characters').insert([{
        user_id: signUpData.user.id,
        username: username,
        nickname: nickname,
        name: charName,
        role: `${grade} (${origin})`,
        klotho: stats.klotho,
        lachesis: stats.lachesis,
        atropos: stats.atropos,
        available_points: 0
      }]);

      if (dbError) return alert("DB 저장 오류: " + dbError.message);

      alert("성공적으로 회원가입이 완료되었습니다!");
      closeSignupModal();
      renderMainApp(username, nickname);
    }

    function renderMainApp(username, nickname) {
      document.getElementById('step-0-card').classList.add('hidden');
      document.getElementById('signup-card').classList.add('hidden');
      document.getElementById('guide-card').classList.add('hidden');
      document.getElementById('main-app').classList.remove('hidden');
      document.getElementById('user-info-text').innerText = `${nickname} (${username}) 님으로 접속되었습니다.`;
    }

    async function handleLogout() {
      await supabaseClient.auth.signOut();
      document.getElementById('main-app').classList.add('hidden');
      document.getElementById('step-0-card').classList.remove('hidden');
    }
  </script>
</body>
