<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>[달에서.] 커뮤니티</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
    }

    body {
      background-color: #121212;
      color: #e0e0e0;
      min-height: 100vh;
    }

    .hidden {
      display: none !important;
    }

    /* === 1. 초기 중앙 카드 (로그인 / 스탯 설정 공통) === */
    .center-wrapper {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .card {
      background-color: #1e1e1e;
      border: 1px solid #333;
      border-radius: 12px;
      padding: 28px;
      width: 100%;
      max-width: 460px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
    }

    h1 {
      font-size: 1.4rem;
      margin-bottom: 20px;
      color: #ffffff;
      font-weight: 700;
    }

    .form-group { margin-bottom: 16px; }
    label { display: block; font-size: 0.9rem; margin-bottom: 6px; color: #aaa; }

    input, select, textarea {
      width: 100%;
      padding: 10px 12px;
      border-radius: 6px;
      border: 1px solid #444;
      background-color: #2a2a2a;
      color: #fff;
      font-size: 0.95rem;
      outline: none;
    }

    textarea { resize: vertical; min-height: 80px; }
    input:focus, select:focus, textarea:focus { border-color: #4b6cb7; }

    button {
      width: 100%;
      padding: 12px;
      border-radius: 6px;
      border: none;
      background-color: #3b5998;
      color: #fff;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s;
      margin-top: 10px;
    }

    button:hover { background-color: #4c70ba; }

    .stat-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
      font-size: 0.95rem;
    }

    .stat-btn {
      width: 32px;
      height: 32px;
      border-radius: 4px;
      background-color: #3a3a3a;
      margin-top: 0;
    }

    .warning-box {
      background-color: rgba(255, 152, 0, 0.1);
      border: 1px solid #ff9800;
      border-radius: 6px;
      padding: 10px 12px;
      margin-bottom: 16px;
      font-size: 0.85rem;
      color: #ffb74d;
    }

    .error-msg { color: #ff6b6b; font-size: 0.85rem; margin-top: 10px; }

    /* === 2. 카카오스토리 레이아웃 === */
    .app-header {
      position: sticky;
      top: 0;
      background-color: #1e1e1e;
      border-bottom: 1px solid #333;
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      z-index: 100;
    }

    .logo {
      font-size: 1.2rem;
      font-weight: 800;
      color: #ffc107;
    }

    .nav-tabs {
      display: flex;
      gap: 8px;
    }

    .nav-btn {
      background: transparent;
      border: none;
      color: #888;
      padding: 8px 16px;
      font-size: 0.95rem;
      cursor: pointer;
      margin-top: 0;
      border-bottom: 2px solid transparent;
      border-radius: 0;
      width: auto;
    }

    .nav-btn.active {
      color: #fff;
      border-bottom-color: #ffc107;
      font-weight: bold;
    }

    .main-layout {
      max-width: 960px;
      margin: 24px auto;
      display: flex;
      gap: 24px;
      padding: 0 16px;
    }

    .feed-container {
      flex: 1;
      max-width: 620px;
    }

    .side-panel {
      width: 280px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .panel-card {
      background-color: #1e1e1e;
      border: 1px solid #333;
      border-radius: 10px;
      padding: 16px;
    }

    .post-box {
      background-color: #1e1e1e;
      border: 1px solid #333;
      border-radius: 10px;
      padding: 18px;
      margin-bottom: 16px;
    }

    .post-header {
      display: flex;
      justify-content: space-between;
      margin-bottom: 10px;
      font-size: 0.85rem;
      color: #aaa;
    }

    .post-author { font-weight: bold; color: #ffc107; }
    .post-content { font-size: 0.95rem; line-height: 1.5; white-space: pre-wrap; }

    /* 토스트 알림 */
    #toast {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      background-color: #2e7d32;
      color: #fff;
      padding: 10px 20px;
      border-radius: 6px;
      opacity: 0;
      visibility: hidden;
      transition: all 0.3s;
      z-index: 1000;
    }
    #toast.show { opacity: 1; visibility: visible; }
  </style>
</head>
<body>

  <!-- STEP 1: 접속 / 회원가입 -->
  <div id="auth-section" class="center-wrapper">
    <div class="card">
      <h1>[달에서.] 접속하기</h1>
      <div class="form-group"><input type="text" id="username" placeholder="아이디 입력"></div>
      <div class="form-group"><input type="password" id="password" placeholder="비밀번호 (6자리 이상)"></div>
      <div class="form-group"><input type="text" id="char-name" placeholder="캐릭터 이름 입력"></div>
      <div class="form-group">
        <label>직급 선택:</label>
        <select id="role-select">
          <option value="student">일반 학생 (10pt / 상한 5)</option>
          <option value="council">학생회장 (12pt / 상한 6)</option>
          <option value="teacher">교사 (15pt / 상한 7)</option>
        </select>
      </div>
      <button onclick="handleAuth()">접속 / 가입</button>
      <div id="auth-error" class="error-msg"></div>
    </div>
  </div>

  <!-- STEP 2: 최초 캐릭터 스탯 설정 (가입 후 한 번만 거침) -->
  <div id="character-setup-section" class="center-wrapper hidden">
    <div class="card">
      <h1 id="setup-char-name">캐릭터 스탯 설정</h1>
      <p style="margin-bottom: 12px; color: #aaa;">남은 포인트: <span id="setup-pts" style="color: #ffc107; font-weight: bold;">0</span></p>

      <div class="warning-box">
        ⚠️ 초기 스탯은 저장 후 수정이 불가능합니다!
      </div>

      <div style="margin-bottom: 20px;">
        <div class="stat-row">
          <span>지혜 (Wisdom): <b id="setup-wisdom">1</b></span>
          <div>
            <button class="stat-btn" onclick="adjustStat('wisdom', -1)">-</button>
            <button class="stat-btn" onclick="adjustStat('wisdom', 1)">+</button>
          </div>
        </div>
        <div class="stat-row">
          <span>의지 (Willpower): <b id="setup-willpower">1</b></span>
          <div>
            <button class="stat-btn" onclick="adjustStat('willpower', -1)">-</button>
            <button class="stat-btn" onclick="adjustStat('willpower', 1)">+</button>
          </div>
        </div>
        <div class="stat-row">
          <span>가호 (Divine): <b id="setup-divine">1</b></span>
          <div>
            <button class="stat-btn" onclick="adjustStat('divine', -1)">-</button>
            <button class="stat-btn" onclick="adjustStat('divine', 1)">+</button>
          </div>
        </div>
        <div class="stat-row">
          <span>교감 (Affinity): <b id="setup-affinity">1</b></span>
          <div>
            <button class="stat-btn" onclick="adjustStat('affinity', -1)">-</button>
            <button class="stat-btn" onclick="adjustStat('affinity', 1)">+</button>
          </div>
        </div>
      </div>

      <button style="background-color: #2e7d32;" onclick="saveInitialStats()">스탯 확정 및 커뮤니티 입장</button>
    </div>
  </div>

  <!-- STEP 3: 메인 커뮤니티 (카카오스토리 스타일) -->
  <div id="main-community-section" class="hidden">
    
    <!-- 상단 네비게이션 헤더 -->
    <header class="app-header">
      <div class="logo">🌙 달에서.</div>
      <div class="nav-tabs">
        <button class="nav-btn active" id="btn-tab-story" onclick="switchMainTab('story')">스토리</button>
        <button class="nav-btn" id="btn-tab-profile" onclick="switchMainTab('profile')">내 프로필</button>
        <button class="nav-btn" id="btn-tab-friends" onclick="switchMainTab('friends')">친구 관리</button>
      </div>
    </header>

    <!-- 메인 컨텐츠 영역 -->
    <div class="main-layout">
      
      <!-- 중앙 메인 피드 -->
      <div class="feed-container">
        
        <!-- 탭 1: 스토리 피드 -->
        <div id="tab-story-content">
          <div class="post-box">
            <textarea id="post-input" placeholder="오늘 어떤 일이 있었나요? 이야기를 남겨보세요..."></textarea>
            <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 10px;">
              <select id="post-visibility" style="width: 140px;">
                <option value="public">전체공개</option>
                <option value="friends">친구공개</option>
              </select>
              <button onclick="submitPost()" style="width: 90px; margin-top: 0;">올리기</button>
            </div>
          </div>
          <div id="posts-feed"></div>
        </div>

        <!-- 탭 2: 내 캐릭터 프로필 -->
        <div id="tab-profile-content" class="hidden">
          <div class="post-box">
            <h2 id="profile-name" style="margin-bottom: 8px;">-</h2>
            <p style="color: #aaa; margin-bottom: 16px;">직급: <span id="profile-role" style="color:#fff;">-</span></p>
            <hr style="border-color: #333; margin-bottom: 16px;">
            <p>지혜: <b id="profile-wisdom">0</b></p>
            <p>의지: <b id="profile-willpower">0</b></p>
            <p>가호: <b id="profile-divine">0</b></p>
            <p>교감: <b id="profile-affinity">0</b></p>
          </div>
        </div>

        <!-- 탭 3: 친구 관리 -->
        <div id="tab-friends-content" class="hidden">
          <div class="post-box">
            <div style="display: flex; gap: 8px;">
              <input type="text" id="friend-search-name" placeholder="친구 캐릭터 이름 검색">
              <button onclick="addFriendByName()" style="width: 90px; margin-top: 0;">추가</button>
            </div>
          </div>
          <div id="friend-list"></div>
        </div>

      </div>

      <!-- 우측 사이드 패널 (카카오스토리 프로필 카드 방식) -->
      <div class="side-panel">
        <div class="panel-card">
          <h3 id="side-char-name" style="color: #ffc107; margin-bottom: 4px;">-</h3>
          <p id="side-char-role" style="font-size: 0.85rem; color: #aaa;">-</p>
        </div>
      </div>

    </div>
  </div>

  <div id="toast">알림</div>

  <script>
    const SUPABASE_URL = 'https://ussdpozmngczyrabcgun.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_NHt6pA_nGOl4zDKgUTntfA_LGioJewy';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let currentUserId = null;
    let characterData = null;
    let friendsList = [];

    const ROLE_CONFIG = {
      student: { name: '일반 학생', pts: 10, max: 5 },
      council: { name: '학생회장', pts: 12, max: 6 },
      teacher: { name: '교사', pts: 15, max: 7 }
    };

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.innerText = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2500);
    }

    async function handleAuth() {
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value.trim();
      const charName = document.getElementById('char-name').value.trim();
      const roleKey = document.getElementById('role-select').value;

      if (!username || !password) return alert('아이디와 비밀번호를 입력해주세요.');

      const email = `${username}@lunar-academy.trpg`;
      let { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });

      if (error) {
        if (!charName) return alert('회원가입을 위해 캐릭터 이름을 입력해주세요.');
        const signUp = await supabaseClient.auth.signUp({ email, password });
        if (signUp.error) return alert(signUp.error.message);

        data = signUp.data;
        const roleInfo = ROLE_CONFIG[roleKey];
        await supabaseClient.from('characters').insert([{
          user_id: data.user.id,
          name: charName,
          role: roleInfo.name,
          wisdom: 1, willpower: 1, divine: 1, affinity: 1,
          available_points: roleInfo.pts
        }]);
      }

      currentUserId = data.user.id;
      loadFlow();
    }

    async function loadFlow() {
      const { data } = await supabaseClient.from('characters').select('*').eq('user_id', currentUserId).single();
      characterData = data;

      document.getElementById('auth-section').classList.add('hidden');

      // 포인트가 남아있다면 스탯 설정 창으로 이동
      if (characterData.available_points > 0) {
        renderSetupView();
        document.getElementById('character-setup-section').classList.remove('hidden');
      } else {
        // 이미 설정 완료된 계정이면 바로 메인 커뮤니티 진입
        enterCommunity();
      }
    }

    function renderSetupView() {
      document.getElementById('setup-char-name').innerText = characterData.name;
      document.getElementById('setup-pts').innerText = characterData.available_points;
      document.getElementById('setup-wisdom').innerText = characterData.wisdom;
      document.getElementById('setup-willpower').innerText = characterData.willpower;
      document.getElementById('setup-divine').innerText = characterData.divine;
      document.getElementById('setup-affinity').innerText = characterData.affinity;
    }

    function adjustStat(stat, val) {
      if (val > 0 && characterData.available_points <= 0) return showToast('포인트가 부족합니다.');
      if (val < 0 && characterData[stat] <= 1) return;

      characterData[stat] += val;
      characterData.available_points -= val;
      renderSetupView();
    }

    async function saveInitialStats() {
      await supabaseClient.from('characters').update({
        wisdom: characterData.wisdom,
        willpower: characterData.willpower,
        divine: characterData.divine,
        affinity: characterData.affinity,
        available_points: 0
      }).eq('user_id', currentUserId);

      characterData.available_points = 0;
      document.getElementById('character-setup-section').classList.add('hidden');
      enterCommunity();
    }

    function enterCommunity() {
      document.getElementById('main-community-section').classList.remove('hidden');
      document.getElementById('side-char-name').innerText = characterData.name;
      document.getElementById('side-char-role').innerText = characterData.role;
      switchMainTab('story');
    }

    function switchMainTab(tab) {
      document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
      document.getElementById('tab-story-content').classList.add('hidden');
      document.getElementById('tab-profile-content').classList.add('hidden');
      document.getElementById('tab-friends-content').classList.add('hidden');

      document.getElementById(`btn-tab-${tab}`).classList.add('active');
      document.getElementById(`tab-${tab}-content`).classList.remove('hidden');

      if (tab === 'story') loadPosts();
      if (tab === 'profile') renderProfileView();
      if (tab === 'friends') loadFriends();
    }

    function renderProfileView() {
      document.getElementById('profile-name').innerText = characterData.name;
      document.getElementById('profile-role').innerText = characterData.role;
      document.getElementById('profile-wisdom').innerText = characterData.wisdom;
      document.getElementById('profile-willpower').innerText = characterData.willpower;
      document.getElementById('profile-divine').innerText = characterData.divine;
      document.getElementById('profile-affinity').innerText = characterData.affinity;
    }

    async function submitPost() {
      const content = document.getElementById('post-input').value.trim();
      const visibility = document.getElementById('post-visibility').value;
      if (!content) return;

      await supabaseClient.from('posts').insert([{
        user_id: currentUserId,
        author_name: characterData.name,
        content: content,
        visibility: visibility
      }]);

      document.getElementById('post-input').value = '';
      showToast('스토리가 등록되었습니다.');
      loadPosts();
    }

    async function loadPosts() {
      const { data } = await supabaseClient.from('posts').select('*').order('created_at', { ascending: false });
      const feed = document.getElementById('posts-feed');
      feed.innerHTML = '';

      if (!data || data.length === 0) {
        feed.innerHTML = '<p style="color: #888; text-align: center; padding: 20px;">등록된 글이 없습니다.</p>';
        return;
      }

      data.forEach(p => {
        const item = document.createElement('div');
        item.className = 'post-box';
        item.innerHTML = `
          <div class="post-header">
            <span class="post-author">${p.author_name}</span>
            <span>${new Date(p.created_at).toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' })}</span>
          </div>
          <div class="post-content">${p.content}</div>
        `;
        feed.appendChild(item);
      });
    }

    async function loadFriends() {
      const { data } = await supabaseClient.from('friends').select('*').eq('user_id', currentUserId);
      friendsList = data || [];
      const listDiv = document.getElementById('friend-list');
      listDiv.innerHTML = friendsList.length ? '' : '<p style="color: #888;">친구 목록이 비어있습니다.</p>';
    }

    async function addFriendByName() {
      const targetName = document.getElementById('friend-search-name').value.trim();
      if (!targetName) return;

      const { data: targetChar } = await supabaseClient.from('characters').select('user_id').eq('name', targetName).maybeSingle();
      if (!targetChar) return showToast('캐릭터를 찾을 수 없습니다.');

      await supabaseClient.from('friends').insert([{ user_id: currentUserId, friend_id: targetChar.user_id }]);
      showToast('친구가 추가되었습니다.');
      document.getElementById('friend-search-name').value = '';
      loadFriends();
    }
  </script>
</body>
</html>
