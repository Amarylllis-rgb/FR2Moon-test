<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>달에서. - 스탯 시스템 테스트</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { font-family: 'Apple SD Gothic Neo', sans-serif; background: #121212; color: #e0e0e0; padding: 20px; }
    .card { background: #1e1e1e; padding: 20px; border-radius: 8px; max-width: 400px; margin: 0 auto 20px; border: 1px solid #333; }
    input, select, button { width: 100%; padding: 10px; margin: 5px 0 15px; box-sizing: border-box; background: #2a2a2a; color: #fff; border: 1px solid #444; border-radius: 4px; }
    button { background: #4a6fa5; cursor: pointer; font-weight: bold; }
    button:hover { background: #3b5984; }
    .stat-row { display: flex; justify-content: space-between; align-items: center; margin: 10px 0; }
    .stat-row button { width: 40px; margin: 0; padding: 5px; }
  </style>
</head>
<body>

  <!-- 1. 로그인 / 회원가입 및 캐릭터 생성 -->
  <div id="setup-section" class="card">
    <h2>[달에서.] 테스트 접속</h2>
    <input type="text" id="username" placeholder="아이디" />
    <input type="password" id="password" placeholder="비밀번호 (6자리 이상)" />
    <input type="text" id="char-name" placeholder="캐릭터 이름 (첫 접속 시)" />
    
    <label for="role-select">직급 선택:</label>
    <select id="role-select">
      <option value="student">일반 학생 (초기 10pt / 스탯 상한 5)</option>
      <option value="president">학생회장 (초기 15pt / 스탯 상한 7)</option>
      <option value="teacher">교사/관찰자 (초기 20pt / 스탯 상한 10)</option>
    </select>

    <button onclick="handleStart()">시작하기 (접속/가입)</button>
    <p id="auth-msg" style="color: #ff8a80;"></p>
  </div>

  <!-- 2. 캐릭터 정보 및 스탯 투자 화면 -->
  <div id="game-section" class="card" style="display:none;">
    <h2 id="display-name">캐릭터 시트</h2>
    <p>직급: <b id="display-role"></b></p>
    <p>남은 포인트: <b id="display-pts" style="color: #ffd54f;">0</b></p>
    <hr style="border-color: #333;" />

    <div class="stat-row"><span>지혜 (Wisdom): <b id="val-wisdom">0</b></span> <button onclick="addStat('wisdom')">+</button></div>
    <div class="stat-row"><span>의지 (Willpower): <b id="val-willpower">0</b></span> <button onclick="addStat('willpower')">+</button></div>
    <div class="stat-row"><span>가호 (Divine): <b id="val-divine">0</b></span> <button onclick="addStat('divine')">+</button></div>
    <div class="stat-row"><span>교감 (Affinity): <b id="val-affinity">0</b></span> <button onclick="addStat('affinity')">+</button></div>

    <br/>
    <button onclick="saveStats()" style="background: #2e7d32;">스탯 저장하기</button>
  </div>

  <script>
    // ⚠️ 아래 두 항목을 본인의 Supabase 주소 및 키로 입력하세요!
    const SUPABASE_URL = 'https://ussdpozmngczyrabcgun.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_NHt6pA_nGOl4zDKgUTntfA_LGioJewy';
    
    const dbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let myChar = null;

    const ROLE_CONFIG = {
      student: { name: '일반 학생', points: 10, maxCap: 5 },
      president: { name: '학생회장', points: 15, maxCap: 7 },
      teacher: { name: '교사', points: 20, maxCap: 10 }
    };

    async function handleStart() {
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value.trim();
      const charName = document.getElementById('char-name').value.trim();
      const role = document.getElementById('role-select').value;
      const msg = document.getElementById('auth-msg');

      if(!username || !password) return msg.innerText = "아이디와 비밀번호를 입력해주세요.";
      if(password.length < 6) return msg.innerText = "비밀번호는 최소 6자리 이상이어야 합니다.";
      
      const fakeEmail = `${username}@lunar-academy.trpg`;

      // 1. 로그인 시도
      let { data, error } = await dbClient.auth.signInWithPassword({ email: fakeEmail, password });

      // 2. 가입 시도 (계정이 없으면 자동 생성)
      if (error) {
        const signUpRes = await dbClient.auth.signUp({ email: fakeEmail, password });
        if (signUpRes.error) return msg.innerText = "접속 에러: " + signUpRes.error.message;
        data = signUpRes.data;
      }

      const user = data.user;
      if (!user) return msg.innerText = "사용자 정보를 불러올 수 없습니다.";

      // 3. 캐릭터 조회 및 생성
      let charRes = await dbClient.from('characters').select('*').eq('user_id', user.id).maybeSingle();

      if (!charRes.data) {
        if(!charName) return msg.innerText = "새 캐릭터 이름을 입력해 주세요.";
        
        const config = ROLE_CONFIG[role];
        const newChar = {
          user_id: user.id,
          name: charName,
          role: role,
          wisdom: 1, willpower: 1, divine: 1, affinity: 1,
          available_points: config.points - 4
        };

        const insertRes = await dbClient.from('characters').insert([newChar]).select().single();
        if (insertRes.error) return msg.innerText = "캐릭터 생성 에러: " + insertRes.error.message;
        myChar = insertRes.data;
      } else {
        myChar = charRes.data;
      }

      renderUI();
    }

    function renderUI() {
      document.getElementById('setup-section').style.display = 'none';
      document.getElementById('game-section').style.display = 'block';

      document.getElementById('display-name').innerText = myChar.name;
      document.getElementById('display-role').innerText = ROLE_CONFIG[myChar.role].name;
      document.getElementById('display-pts').innerText = myChar.available_points;

      document.getElementById('val-wisdom').innerText = myChar.wisdom;
      document.getElementById('val-willpower').innerText = myChar.willpower;
      document.getElementById('val-divine').innerText = myChar.divine;
      document.getElementById('val-affinity').innerText = myChar.affinity;
    }

    function addStat(statName) {
      const config = ROLE_CONFIG[myChar.role];

      if (myChar.available_points <= 0) return alert("사용 가능한 포인트가 없습니다.");
      if (myChar[statName] >= config.maxCap) return alert(`${config.name} 직급은 스탯을 ${config.maxCap} 초과하여 올릴 수 없습니다.`);

      myChar[statName] += 1;
      myChar.available_points -= 1;
      renderUI();
    }

    async function saveStats() {
      const { error } = await dbClient.from('characters').upsert(myChar);
      if(error) alert("저장 실패: " + error.message);
      else alert("성공적으로 저장되었습니다!");
    }
  </script>
</body>
</html>
